# Option B bridge config: same as ign_gazebo_bridge.yaml but WITHOUT arm_camera pointcloud.
# Pointcloud is generated on ROS side by depth_image_proc with correct optical frame.

# front_laser
- ros_topic_name: "/front_laser/scan"
  gz_topic_name: "/front_laser/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  subscriber_queue: 10
  publisher_queue: 10
  lazy: false
  direction: GZ_TO_ROS

# rear_laser
- ros_topic_name: "/rear_laser/scan"
  gz_topic_name: "/rear_laser/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  subscriber_queue: 10
  publisher_queue: 10
  lazy: false
  direction: GZ_TO_ROS

